<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tea Over Coffee</title>
<meta name="description" content="A daily five-minute digest of B2B tech news with product marketing takeaways.">
<meta name="theme-color" content="#1C0F13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tea Over Coffee">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: one narrow reading column with a tab bar: Today, Past cups, Saved. */
:root {
  /* Palette: Coffee Bean, Oxidized Iron, Azure Mist, Electric Sapphire, Slate Grey. Always dark. */
  --bg: #1C0F13;
  --surface: #28181D;
  --ink: #F2FDFF;
  --muted: #9EAEC4;
  --line: #3C2A30;
  --matcha: #E5775B;
  --matcha-soft: #2C2D58;
  --sage: #2C2D58;
  --chai: #9BA2FF;
  color-scheme: dark;
  --title: "League Spartan", "Futura", "Avenir Next", system-ui, sans-serif;
  --display: "DM Sans", system-ui, -apple-system, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 36px; }
header { display: flex; flex-direction: column; gap: 4px; }
.date { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1 { font-family: var(--title); font-weight: 800; font-size: clamp(36px, 10vw, 54px); line-height: .95; margin: 6px 0 0; letter-spacing: .01em; text-transform: uppercase; }
h1 span { color: var(--matcha); display: inline-block; transform: rotate(-8deg) translateY(-.04em); margin: 0 -.2em; font-size: .82em; }
.tag { color: var(--muted); margin: 4px 0 0; font-size: 15px; }
.label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.quote { background: var(--sage); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.quote blockquote { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(19px, 4.4vw, 23px); line-height: 1.35; text-wrap: balance; }
.quote .who { color: var(--muted); font-size: 14px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
h2 { font-family: var(--title); font-size: 22px; letter-spacing: .04em; text-transform: uppercase; font-weight: 800; color: var(--ink); margin: 0; line-height: 1; padding-top: 4px; }
.stories { display: flex; flex-direction: column; gap: 14px; }
.story { background: var(--surface); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: opacity .25s; }
.story.fade { opacity: .15; }
.story h3 { font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.3; margin: 0; text-wrap: balance; }
.story p { margin: 0; font-size: 15px; color: var(--muted); }
.story .pmm { color: var(--ink); }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.kind { color: var(--matcha); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.pmm { padding-top: 2px; }
.pmm b { display: block; color: var(--matcha); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; padding-top: 4px; }
.foot a { color: var(--muted); }
.swap { border: 0; padding: 4px 0; color: var(--matcha); }
a { color: var(--matcha); }
button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; cursor: pointer; }
.quote button { border-color: var(--chai); }
button:hover { border-color: var(--matcha); color: var(--matcha); }
button:focus-visible { outline: 2px solid var(--matcha); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
.term { border-left: 2px solid var(--matcha); padding: 4px 0 4px 14px; display: flex; flex-direction: column; gap: 4px; }
.term strong { font-family: var(--display); font-size: 17px; font-weight: 600; }
.term p { margin: 0; color: var(--muted); font-size: 15px; }
footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
@media (prefers-reduced-motion: reduce) { .story { transition: none; } }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.share { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 10px; }
.share svg { width: 16px; height: 16px; }
.tip { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--surface); border-top: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tip p { margin: 0; font-size: 13px; color: var(--muted); min-width: 0; max-width: 600px; }
.tip button { flex-shrink: 0; border: 0; width: 32px; height: 32px; padding: 0; display: grid; place-items: center; color: var(--muted); }
.tip svg { width: 16px; height: 16px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs a { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--sage); border-color: var(--sage); }
.section { display: flex; flex-direction: column; gap: 14px; }
.story .actions { display: flex; gap: 16px; align-items: center; }
#view { display: flex; flex-direction: column; gap: 36px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 32px; }
.story { position: relative; }
.story .meta { padding-right: 40px; }
.save { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 99px; padding: 0; display: grid; place-items: center; color: var(--muted); }
.save:hover { color: var(--chai); }
.save[aria-pressed="true"] { color: var(--chai); }
.save svg { width: 20px; height: 20px; }
.save[aria-pressed="true"] path { fill: currentColor; }
.refill { border-color: var(--matcha); color: var(--matcha); }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10, 4, 6, .72); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); animation: fadein .18s ease-out; }
.confirm { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px 22px 20px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: pop .2s ease-out; }
.confirm h3 { margin: 0; font-size: 19px; font-weight: 600; }
.confirm .btns { justify-content: center; }
.confirm .btns button { flex: 1; padding: 10px 14px; font-size: 14px; }
@keyframes fadein { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.95); } }
@media (prefers-reduced-motion: reduce) { .overlay, .confirm { animation: none; } }
.confirm p { margin: 0; font-size: 15px; color: var(--muted); }
.confirm .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.primary { background: var(--matcha); border-color: var(--matcha); color: var(--bg); }
.primary:hover { color: var(--bg); opacity: .9; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 99px; transition: opacity .25s, transform .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.list { display: flex; flex-direction: column; gap: 10px; }
.day { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border-radius: 14px; padding: 16px 18px; text-decoration: none; color: var(--ink); }
.day span { color: var(--muted); font-size: 14px; min-width: 0; }
.day strong { font-weight: 600; }
.empty { color: var(--muted); font-size: 15px; margin: 0; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; padding: 8px 14px 8px 10px; border: 1px solid var(--line); border-radius: 99px; margin-bottom: -16px; }
.back svg { width: 16px; height: 16px; }
.back:hover { border-color: var(--matcha); color: var(--matcha); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><div class="date" id="date"></div>
      <button type="button" class="share" id="share" aria-label="Share Tea Over Coffee"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v7.5h14V12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Share</button></div>
    <h1>Tea <span>over</span> Coffee</h1>
    <p class="tag">Spilling the B2B tech tea, one cup a day.</p>
  </header>

  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-tab="today">Today</a>
    <a href="#past" data-tab="past">Past cups</a>
    <a href="#saved" data-tab="saved">Saved <span id="savedCount"></span></a>
  </nav>

  <main id="view" aria-live="polite"></main>

  <footer id="foot"></footer>
</div>

<div class="tip" id="tip" hidden>
  <p>Tip: in Safari, tap Share, then "Add to Home Screen" to keep Tea Over Coffee one tap away.</p>
  <button type="button" id="tipClose" aria-label="Dismiss tip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (d, opts) => new Date(d + "T12:00:00").toLocaleDateString("en-US", opts);
const longDate = d => fmt(d, { weekday: "long", month: "long", day: "numeric", year: "numeric" });

// Saved stories live on this phone only.
const KEY = "tea-saved";
function loadSaved() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function storeSaved(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {} }
let saved = loadSaved();

let days = [];
const cache = {};
async function getJSON(url) { const r = await fetch(url, { cache: "no-cache" }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function edition(day) { return cache[day] ||= await getJSON("editions/" + day + ".json"); }

// Per-edition state: which 4 stories are poured, and the next one in the pot.
const pour = {};
function stateFor(ed) { return pour[ed.date] ||= { shown: [0, 1, 2, 3].filter(i => i < ed.stories.length), next: 4 }; }
// Take the next story from the pot that isn't already on screen, looping back to the start when the pot runs dry.
function nextStory(ed) {
  const st = stateFor(ed);
  for (let k = 0; k < ed.stories.length; k++) {
    const i = st.next % ed.stories.length; st.next++;
    if (!st.shown.includes(i)) return i;
  }
  return st.shown[0];
}
let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function redrawStories() { const st = stateFor(current); $("stories").innerHTML = st.shown.map((i, n) => storyCard(current, i, n)).join(""); }

function storyCard(ed, i, slot, opts = {}) {
  const s = ed.stories[i];
  const id = ed.date + "#" + i;
  const isSaved = saved.some(x => x.id === id);
  return `<article class="story" id="slot${slot}">
    <button type="button" class="save" data-save="${esc(id)}" aria-pressed="${isSaved}" aria-label="${isSaved ? "Remove from saved" : "Save for later"}" title="${isSaved ? "Saved" : "Save for later"}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg></button>
    <div class="meta"><span class="kind">${esc(s.tag)}</span><span>${esc(s.date)}</span></div>
    <h3>${esc(s.headline)}</h3>
    <p>${esc(s.summary)}</p>
    <p class="pmm"><b>Takeaway</b> ${esc(s.takeaway)}</p>
    <div class="foot"><a href="${esc(s.source)}" target="_blank" rel="noopener">Source</a>
</div>
  </article>`;
}

let current = null;
function renderEdition(ed, isToday, fromPast) {
  current = ed;
  const st = stateFor(ed);
  $("date").textContent = longDate(ed.date);
  $("view").innerHTML = `
    ${fromPast ? `<a class="back" href="#past"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to past cups</a>` : ""}
    <section class="section">
      <h2>${isToday ? "Today's sip" : "That day's sip"}</h2>
      <div class="quote"><blockquote>“${esc(ed.quote.text)}”</blockquote>
      <div class="who">${esc(ed.quote.who)}</div></div>
    </section>
    <section class="section">
      <div class="head"><h2>${isToday ? "Today's tea" : "That day's tea"}</h2>
        ${ed.stories.length > 4 ? `<button type="button" class="refill" id="refill">Pour me another</button>` : ""}</div>
      <div id="confirmBox"></div>
      <div class="stories" id="stories">${st.shown.map((i, slot) => storyCard(ed, i, slot)).join("")}</div>
    </section>
    ${ed.term ? `<section class="term"><span class="label">Term of the day</span><strong>${esc(ed.term.name)}</strong><p>${esc(ed.term.def)}</p></section>` : ""}`;
  $("foot").innerHTML = "Brewed from " + (ed.sources || []).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join(" and ") +
    ". Takeaways are commentary, not reporting. A fresh cup every morning at 7:12 AM Pacific.";
}

function renderPast() {
  current = null;
  $("date").textContent = "Every cup so far";
  $("view").innerHTML = `<section class="section"><h2>Past cups</h2><div class="list">${
    days.map((d, n) => `<a class="day" href="#d-${d}"><strong>${fmt(d, { weekday: "short", month: "short", day: "numeric" })}</strong><span>${n === 0 ? "Today" : "Read again"} &rarr;</span></a>`).join("")
  }</div></section>`;
  $("foot").textContent = "";
}

function renderSaved() {
  current = null;
  $("date").textContent = "Your reading list";
  $("view").innerHTML = `<section class="section"><h2>Saved</h2>${
    saved.length ? `<div class="stories">${saved.slice().reverse().map(x => {
      const ed = { date: x.id.split("#")[0], stories: { [x.i]: x.story } };
      return storyCard(ed, x.i, "s" + x.i, { noPour: true }).replace('<div class="meta">', `<div class="meta"><span>${fmt(ed.date, { month: "short", day: "numeric" })} cup ·</span>`);
    }).join("")}</div>`
    : `<p class="empty">Nothing saved yet. Tap "Save for later" on any story and it will wait for you here.</p>`
  }</section>`;
  $("foot").textContent = "Saved stories stay on this phone.";
}

function updateCount() { $("savedCount").textContent = saved.length ? "(" + saved.length + ")" : ""; }

async function route() {
  const h = location.hash.slice(1) || "today";
  const tab = h === "past" || h.startsWith("d-") ? "past" : h === "saved" ? "saved" : "today";
  document.querySelectorAll(".tabs a").forEach(a => a.dataset.tab === tab ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  updateCount();
  try {
    if (h === "past") return renderPast();
    if (h === "saved") return renderSaved();
    if (h.startsWith("d-") && days.includes(h.slice(2))) return renderEdition(await edition(h.slice(2)), h.slice(2) === days[0], true);
    renderEdition(await edition(days[0]), true);
  } catch (e) {
    $("view").innerHTML = `<p class="empty">The kettle is still heating. Check your connection and pull down to refresh.</p>`;
  }
}

document.addEventListener("click", e => {
  const sv = e.target.closest("button[data-save]");
  if (sv) {
    const id = sv.dataset.save;
    const at = saved.findIndex(x => x.id === id);
    if (at >= 0) saved.splice(at, 1);
    else {
      const [d, i] = id.split("#");
      const story = cache[d]?.stories[+i];
      if (story) saved.push({ id, i: +i, story });
    }
    storeSaved(saved); updateCount();
    const on = saved.some(x => x.id === id);
    toast(on ? "Saved for later" : "Removed from saved");
    if (location.hash === "#saved") return renderSaved();
    sv.setAttribute("aria-pressed", on); sv.setAttribute("aria-label", on ? "Remove from saved" : "Save for later"); sv.title = on ? "Saved" : "Save for later";
    return;
  }
  if (e.target.closest("#refill")) {
    $("confirmBox").innerHTML = `<div class="overlay" id="overlay"><div class="confirm" role="dialog" aria-modal="true" aria-labelledby="cTitle">
      <h3 id="cTitle">Pour a fresh cup?</h3><p>All four stories will be swapped for new ones.</p>
      <div class="btns"><button type="button" id="keep">Keep these</button><button type="button" class="primary" id="doRefill">Pour it</button></div></div></div>`;
    $("doRefill").focus();
    return;
  }
  if (e.target.closest("#keep") || e.target.id === "overlay") { $("confirmBox").innerHTML = ""; return; }
  if (e.target.closest("#doRefill")) {
    $("confirmBox").innerHTML = "";
    const st = stateFor(current);
    document.querySelectorAll("#stories .story").forEach(el => el.classList.add("fade"));
    setTimeout(() => {
      const old = st.shown.slice(), fresh = [];
      // Avoid both the stories on screen and the ones already picked; fall back to old ones only if the pot is tiny.
      for (let n = 0; n < old.length; n++) { st.shown = old.concat(fresh); fresh.push(nextStory(current)); }
      st.shown = fresh; redrawStories(); toast("Fresh cup poured ☕");
    }, 220);
    return;
  }
  const b = e.target.closest("button[data-slot]");
  if (!b || !current) return;
  const st = stateFor(current);
  const slot = +b.dataset.slot;
  $("slot" + slot).classList.add("fade");
  setTimeout(() => { st.shown[slot] = nextStory(current); redrawStories(); }, 220);
});

document.addEventListener("keydown", e => { if (e.key === "Escape" && $("confirmBox")) $("confirmBox").innerHTML = ""; });
// Share and first-visit install tip.
const SITE = "https://jennachailatte.github.io/tea-over-coffee/";
$("share").addEventListener("click", async () => {
  const data = { title: "Tea Over Coffee", text: "A daily cup of B2B tech news with product marketing takeaways.", url: SITE };
  if (navigator.share) { try { await navigator.share(data); } catch {} return; }
  try { await navigator.clipboard.writeText(SITE); toast("Link copied. Pass the tea!"); }
  catch { toast(SITE); }
});
const installed = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let tipSeen = false; try { tipSeen = localStorage.getItem("tea-tip") === "1"; } catch {}
if (!installed && !tipSeen) $("tip").hidden = false;
$("tipClose").addEventListener("click", () => { $("tip").hidden = true; try { localStorage.setItem("tea-tip", "1"); } catch {} });

window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
(async () => {
  try { days = await getJSON("editions/index.json"); } catch { days = []; }
  route();
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
